; build and flash the device firmware for the Nucleo F401RE board when no environment is given
[platformio]
default_envs = nucleo_f401re

; use the CMSIS headers and the start-up code of the pinned platform without a vendor framework
[env]
platform = ststm32@19.7.1
framework = cmsis
monitor_speed = 115200

; use a pinned GCC 12 toolchain, the GCC 7 of the platform lacks constexpr std::string_view
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.120301.0

; link the core, app and common firmware libraries in place
lib_deps =
    symlink://../../core
    symlink://../../app
    symlink://../common
lib_ldf_mode = chain+

; pass the build values of CMakeLists.txt and mark the framework headers as system headers
extra_scripts =
    pre:../common/build_settings.py

; use GNU C++17 and accept the writable init and fini arrays in flash, the platform adds -fno-exceptions and -fno-rtti
build_flags =
    -std=gnu++17
    -Wl,--no-warn-rwx-segments

; enable the house warnings for the own sources
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Wconversion
    -Werror
    -pedantic-errors
    -fstrict-aliasing
    -fvisibility=hidden
    -fdiagnostics-show-option
    -Wconversion
    -Wold-style-cast
    -Wfloat-equal
    -Wlogical-op
    -Wundef
    -Wredundant-decls
    -Wwrite-strings
    -Wpointer-arith
    -Wcast-qual
    -Wformat=2
    -Wswitch-default
    -Wmissing-include-dirs
    -Wcast-align
    -Wnon-virtual-dtor
    -Wsign-conversion
    -Wdisabled-optimization
    -Winvalid-pch
    -Woverloaded-virtual
    -Wunused-but-set-variable
    -Wunused-result
    -Wsuggest-attribute=format
    -Wsuggest-attribute=noreturn
    -Wnoexcept
    -Wno-missing-field-initializers
    -Wdouble-promotion
    -Wtrampolines
    -Wzero-as-null-pointer-constant
    -Wvector-operation-performance
    -Wshift-overflow=2
    -Wduplicated-cond
    -Walloc-zero
    -Walloca
    -Wduplicated-branches

; build for the Nucleo F401RE board with the protocol on USART2, the virtual COM port of the ST-LINK
[env:nucleo_f401re]
board = nucleo_f401re

; build for the Nucleo F411RE board with the protocol on USART2, the virtual COM port of the ST-LINK
[env:nucleo_f411re]
board = nucleo_f411re

; build for the STM32F405 of the QEMU machine netduinoplus2 with the protocol on USART2
[env:netduinoplus2-qemu]
board = genericSTM32F405RG
build_src_flags =
    ${env.build_src_flags}
    -DLET_RUN_ON_QEMU
