; build and flash the protocol firmware when no environment is given
[platformio]
default_envs = esp32dev

; use the Arduino framework on FreeRTOS of the pinned platform
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200

; link the core and app libraries in place
lib_deps =
    symlink://../../core
    symlink://../../app
lib_ldf_mode = chain+

; pass the build values of CMakeLists.txt and mark the framework headers as system headers
extra_scripts =
    pre:build_settings.py

; remove the C++ standard of the framework
build_unflags =
    -std=gnu++11

; use GNU C++17 in every source
build_flags =
    -std=gnu++17

; build for the ESP32 DevKit board with the protocol on the USB port
[env:esp32dev]
board = esp32dev
