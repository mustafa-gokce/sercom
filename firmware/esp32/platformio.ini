; build and flash the protocol firmware when no environment is given
[platformio]
default_envs = esp32dev

; use the Arduino framework on FreeRTOS of the pinned platform
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200

; link the core, app and common firmware libraries in place
lib_deps =
    symlink://../../core
    symlink://../../app
    symlink://../common
lib_ldf_mode = chain+

; pass the build values of CMakeLists.txt and mark the framework headers as system headers
extra_scripts =
    pre:../common/build_settings.py

; remove the C++ standard of the framework
build_unflags =
    -std=gnu++11

; use GNU C++17 and switch the framework log off in every source
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

; enable the house warnings for the own sources
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Wconversion
    -Werror
    -pedantic-errors
    -fstrict-aliasing
    -fvisibility=hidden
    -fdiagnostics-show-option
    -Wconversion
    -Wold-style-cast
    -Wfloat-equal
    -Wlogical-op
    -Wundef
    -Wredundant-decls
    -Wwrite-strings
    -Wpointer-arith
    -Wcast-qual
    -Wformat=2
    -Wswitch-default
    -Wmissing-include-dirs
    -Wcast-align
    -Wnon-virtual-dtor
    -Wsign-conversion
    -Wdisabled-optimization
    -Winvalid-pch
    -Woverloaded-virtual
    -Wunused-but-set-variable
    -Wunused-result
    -Wsuggest-attribute=format
    -Wsuggest-attribute=noreturn
    -Wnoexcept
    -Wno-missing-field-initializers
    -Wdouble-promotion
    -Wtrampolines
    -Wzero-as-null-pointer-constant
    -Wvector-operation-performance
    -Wshift-overflow=2
    -Wduplicated-cond
    -Walloc-zero
    -Walloca
    -Wduplicated-branches

; build for the ESP32 DevKit board with the protocol on the USB port
[env:esp32dev]
board = esp32dev

; build for the ESP32 DevKit board with the protocol on UART2 and a readable console on the USB port
[env:esp32dev-console]
board = esp32dev
build_src_flags =
    ${env.build_src_flags}
    -DLET_PRINT_CONSOLE
